<div>
    <label class="gw-label" for="pm-nickname">Nickname</label>
    <input type="text" id="pm-nickname" name="nickname" required maxlength="60"
           class="gw-input" placeholder="e.g. Everyday Visa"
           value="{{ value_nickname|default('') }}" autocomplete="off">
</div>
<div>
    <label class="gw-label" for="pm-kind">Type</label>
    <select id="pm-kind" name="kind" class="gw-select" required>
        {% for value, label in kind_labels.items() %}
        <option value="{{ value }}" {% if value_kind|default('card') == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<div id="pm-provider-wrap" {% if value_kind|default('card') != 'wallet' %}hidden{% endif %}>
    <label class="gw-label" for="pm-provider">Provider</label>
    <select id="pm-provider" name="wallet_provider" class="gw-select"
            {% if value_kind|default('card') != 'wallet' %}disabled{% endif %}>
        <option value="">Select</option>
        {% for value, label in provider_labels.items() %}
        <option value="{{ value }}" {% if value_provider|default('') == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
<div id="pm-funding-wrap" {% if value_kind|default('card') != 'wallet' %}hidden{% endif %}>
    <label class="gw-label" for="pm-funding">Linked card</label>
    <select id="pm-funding" name="funding_method_id" class="gw-select"
            {% if value_kind|default('card') != 'wallet' %}disabled{% endif %}>
        <option value="">Select a card</option>
        {% for card in funding_cards|default([]) %}
        <option value="{{ card.id }}" {% if value_funding|default(none) == card.id %}selected{% endif %}>
            {{ card.owner }} — {{ card.nickname }}{% if card.last4 %} ending {{ card.last4 }}{% endif %}
        </option>
        {% endfor %}
    </select>
</div>
<div id="pm-last4-wrap" {% if value_kind|default('card') == 'wallet' %}hidden{% endif %}>
    <label class="gw-label" for="pm-last4">Last 4 digits</label>
    <input type="text" id="pm-last4" name="last4" inputmode="numeric" maxlength="4"
           class="gw-input" autocomplete="off" value="{{ value_last4|default('') }}"
           {% if value_kind|default('card') in ['manual', 'wallet'] %}disabled{% endif %}>
    <p class="gw-text-muted" style="font-size: 0.75rem; margin-top: 4px;">Only the last 4 digits. Never the full number.</p>
</div>
<div id="pm-expiry-wrap" {% if value_kind|default('card') == 'wallet' %}hidden{% endif %}>
    <label class="gw-label" for="pm-expiry">Expires</label>
    <input type="month" id="pm-expiry" name="expiry" class="gw-input"
           value="{{ value_expiry|default('') }}"
           {% if value_kind|default('card') != 'card' %}disabled{% endif %}>
    <p class="gw-text-muted" style="font-size: 0.75rem; margin-top: 4px;">MM/YY or use the month picker. Firefox: type MM/YY.</p>
</div>
<div>
    <label class="gw-label" for="pm-owner">Owner</label>
    <input type="text" id="pm-owner" name="owner" required maxlength="60"
           class="gw-input" list="owner-options" autocomplete="off"
           value="{{ value_owner|default('') }}">
    <datalist id="owner-options">
        {% for owner in owners %}
        <option value="{{ owner }}"></option>
        {% endfor %}
    </datalist>
</div>
