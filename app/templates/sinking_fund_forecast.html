{% extends "base.html" %}
{% block title %}{{ fund.name }} Forecast — Glow Worm{% endblock %}
{% block content %}
<div style="max-width: 1100px;">

    <!-- Header -->
    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
        <a href="/sinking-funds" class="gw-text-muted" style="text-decoration: none; font-size: 0.9rem;">&larr; Sinking Funds</a>
    </div>
    <h2 class="gw-page-header" style="display: flex; align-items: center; gap: 10px;">
        <span class="gw-dot" style="background-color: {{ fund.color }}; width: 14px; height: 14px; flex-shrink: 0;"></span>
        {{ fund.name }}
    </h2>
    {% if fund.description %}
    <p class="gw-text-muted" style="margin-top: -8px; margin-bottom: 16px;">{{ fund.description }}</p>
    {% endif %}

    <!-- Tab navigation -->
    <div style="display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border-dim);">
        <a href="/sinking-funds/{{ fund.id }}" style="padding: 6px 14px; font-size: 0.875rem; color: var(--text-secondary); text-decoration: none;">Transactions</a>
        <span style="padding: 6px 14px; font-size: 0.875rem; font-weight: 600; border-bottom: 2px solid var(--accent); color: var(--accent); cursor: default;">Forecast</span>
        <a href="/sinking-funds/{{ fund.id }}/history" style="padding: 6px 14px; font-size: 0.875rem; color: var(--text-secondary); text-decoration: none;">History</a>
    </div>

    {% include "_forecast_panel.html" %}

</div>
{% endblock %}
