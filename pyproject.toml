[project]
name = "glow-worm"
version = "0.1.0"
description = "Home budgeting app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.14.2",
    "sqlalchemy==2.1.6",
    "python-dotenv==1.2.4",
    "bcrypt==5.0.0",
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "starlette-csrf==3.0.0",
    "itsdangerous==2.2.0",
    "pytz==2026.6",
    "apscheduler==3.11.3",
    "fastmcp==4.1.4",
    "typer==0.27.3",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "prek==0.5.9",
    "pyrefly==1.4.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.3",
    "types-pytz==2026.6.0.20261031",
]

[project.scripts]
glow = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyrefly]
python-version = "3.14.0"

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends() is intentionally used as a default (DI), not evaluated at definition time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
