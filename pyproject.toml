[project]
name = "glow-worm"
version = "0.1.0"
description = "Home budgeting app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4",
    "sqlalchemy==2.0.52",
    "python-dotenv==1.2.3",
    "bcrypt==5.0.0",
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "starlette-csrf==3.0.0",
    "itsdangerous==2.2.0",
    "pytz==2026.3.post1",
    "apscheduler==3.11.3",
    "fastmcp==3.4.7",
    "typer==0.27.1",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.12",
]

[dependency-groups]
dev = [
    "detect-secrets==1.5.0",
    "prek==0.4.14",
    "pyrefly==1.2.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.4",
    "types-pytz==2026.3.1.20260727",
]

[project.scripts]
glow = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyrefly]
python-version = "3.14.0"
preset = "legacy"
ignore-missing-imports = ["*"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends() is intentionally used as a default (DI), not evaluated at definition time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
