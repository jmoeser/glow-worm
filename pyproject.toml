[project]
name = "glow-worm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.13.4",
    "sqlalchemy==2.0.49",
    "python-dotenv==1.2.2",
    "bcrypt==5.0.0",
    "alembic==1.18.4",
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.29",
    "starlette-csrf==3.0.0",
    "itsdangerous==2.2.0",
    "pytz==2026.2",
    "apscheduler==3.11.2",
    "fastmcp==3.3.1",
    "typer==0.25.1",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.12",
]

[project.optional-dependencies]
dev = [
    "detect-secrets==1.5.0",
    "pre-commit==4.6.0",
    "pyrefly==1.1.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.2",
    "types-pytz==2026.2.0.20260506",
]

[project.scripts]
glow = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyrefly]
python-version = "3.14.0"
preset = "legacy"
ignore-missing-imports = ["*"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI Depends() is intentionally used as a default (DI), not evaluated at definition time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]
